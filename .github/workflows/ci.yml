# ============================================================
# Continuum-Care-Network CI
# 触发：push / PR 到 main
# 任务：
#   1. backend  — Python 3.12 + pytest（SQLite 内存库，无需 PostgreSQL）
#   2. frontend — Node 22 + lint + production build（standalone）
#   3. docker   — 构建 backend/frontend 镜像 + 校验 compose 语法
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest

  frontend-lint-build:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (standalone)
        run: npm run build

  docker-build:
    name: Docker images + compose
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-lint-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ccn-backend:ci ./backend

      - name: Build frontend image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1 -t ccn-web:ci ./frontend

      - name: Validate compose file
        run: docker compose config --quiet
